services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/eve_healthcare
      SECRET_KEY: change-this-secret
    ports:
      - "8000:8000"

volumes:
  postgres_data:
